name: RuneScape - post latest 3

on:
  workflow_dispatch:          # manual only: run it from the Actions tab
    inputs:
      count:
        description: "How many recent posts to send"
        default: "3"

jobs:
  post-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests feedparser

      - run: python runescape_news_webhook.py --latest ${{ inputs.count }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
